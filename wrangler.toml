name = "notion-todoist-mcp"
main = "worker.js"
compatibility_date = "2024-11-01"

# Secrets are set via CLI (not stored here):
#   wrangler secret put NOTION_TOKEN            ← Notion integration token
#   wrangler secret put TODOIST_TOKEN           ← Todoist API token (also used by cron + webhook)
#   wrangler secret put TODOIST_WEBHOOK_SECRET  ← Todoist app client_secret, for /webhook/todoist HMAC verify

# Daily cron at UTC 00:00 == JST 09:00. Drives runDailyNextLabels in src/cron.js
# (adds/removes the `next` label based on due date; see CLAUDE.md § Automation).
[triggers]
crons = ["0 0 * * *"]

[vars]
NOTION_DB_IDS = '{"state":"6492f29c6eee4437af8acb5be76b5654","metrics":"724d65c928b94a6d8d1ad8a7f685178f","events":"8282de48503247bc89481c507b4fec74","food_master":"6442450befed40dc94d3fed7a8411157","habits_page":"3345c9c885a3812c906ec0e1012fd69f"}'
TODOIST_CONFIG = '{"inbox_project_id":"6g8v9q87rGcggMM6"}'
# 指標 SELECT synonym → canonical name. Applied in both n_bulk_metrics (write)
# and n_metrics_series (read). Extend when new synonyms are observed; remove
# only if the legacy DB rows have been retitled. The 腹囲 / 下腹囲 pair is
# intentionally NOT aliased — they are physically different measurements.
#
# 睡眠→睦眠 (typo-defense): the canonical select options were created with a
# typo (睦眠 instead of 睡眠) and hold all the existing sleep data. These
# aliases route the *correct* spelling onto the existing (typo) options so
# writing 睡眠 no longer forks a duplicate select. Canonical stays the typo
# until the option is renamed in Notion (rows auto-migrate on rename); flip
# the alias direction to 睦眠→睡眠 if/when that happens.
#
# HR/安静時心拍数/心拍 → RHR consolidates resting-heart-rate synonyms onto the
# RHR option. 脈拍 is intentionally NOT aliased — it's a distinct point-in-time
# pulse measurement, not a resting-HR average (cf. 腹囲 / 下腹囲).
METRIC_ALIASES = '{"γGT":"γGTP","Cr":"クレアチニン","平均睡眠時間":"平均睦眠時間","レム睡眠平均":"レム睦眠平均","コア睡眠平均":"コア睦眠平均","深い睡眠平均":"深い睦眠平均","HR":"RHR","安静時心拍数":"RHR","心拍":"RHR"}'

# 指標 reference ranges: { "<canonical_name>": [low, high], ... }. Either
# bound may be null for one-sided ranges (e.g. LDL has only an upper bound).
# Consumed by n_metrics_series to attach ref + last_flag ("high"/"low"/"normal")
# to the latest data point. Keyed by canonical (post-alias) names — synonyms
# are normalized before lookup.
#
# Starter set: Japan-standard clinical cutoffs from typical 健診/人間ドック
# printed reference values (JSH 2019 for BP, JSC for lipids, JDS for HbA1c,
# JSN for eGFR, etc.). Adjust to match the printed range on YOUR lab report
# or your personal targets — these are general adult-male defaults.
# RHR [50,75]: fitness-oriented resting-heart-rate target (not the clinical
# 60–100 tachy/brady cutoff) so the flag actually fires — >75 monthly avg = high,
# <50 = low. Adjust to your own baseline.
METRIC_RANGES = '{"LDL":[null,119],"HDL":[40,null],"中性脂肪":[null,149],"総コレステロール":[140,199],"HbA1c":[null,5.5],"血糖":[70,99],"ALT":[null,30],"AST":[null,30],"γGTP":[null,50],"クレアチニン":[0.65,1.07],"eGFR":[60,null],"尿酸":[3.7,7.0],"収縮期血圧":[null,129],"拡張期血圧":[null,79],"BMI":[18.5,24.9],"腹囲":[null,84],"Hb":[13.5,17.0],"体脂肪率":[11,21],"RHR":[50,75]}'

# OAuth state: authorization-code single-use + refresh-token rotation.
# Keys: code:<jti> (TTL 5min), rt:<jti> (TTL 30d), fam:<fam> (TTL 30d, reuse poison).
[[kv_namespaces]]
binding = "OAUTH_STATE"
id = "7a680d3a7e2949cc9deaf3f998325adf"
